app = "trace-meet"
primary_region = "lhr"

[build]

[deploy]
  release_command = "/app/bin/trace_meet eval TraceMeet.Release.migrate"

[env]
  PHX_HOST = "trace-meet.fly.dev"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 1000
    soft_limit = 1000

[[vm]]
  memory = "1gb"
  cpus = 1
  memory_mb = 1024
